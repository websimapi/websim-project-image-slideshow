<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>
      Project Slideshow with Project Info, Floating Comments & Controls
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Top overlay: project details and controls -->
    <div id="project-info" class="overlay top">
      <div class="details">
        <!-- Project details (title & description) will be displayed here -->
      </div>
      <div id="controls">
        <button id="back-btn">Back</button>
        <button id="pause-btn">Pause</button>
        <button id="next-btn">Next</button>
      </div>
    </div>
    <!-- Fullscreen image element for the slideshow -->
    <img id="slideshow-img" alt="Project Image Slideshow" />
    <!-- Bottom overlay: floating comment bubbles container -->
    <div id="comment-info" class="overlay bottom">
      <!-- Up to 10 floating comment bubbles will be rendered here -->
    </div>
    <script type="module" src="script.js"></script>

</html>
